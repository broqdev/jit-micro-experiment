[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jit-micro-experiment"
version = "0.3.0"
description = "Single-device RGB flow matching with local JSONL logging"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6",
    "numpy>=1.26",
    "Pillow>=10",
    "python-dotenv[cli]>=1",
    "huggingface-hub>=0.27",
]

[project.optional-dependencies]
windows-compile = ["triton-windows>=3.7.1.post27,<3.8; sys_platform == 'win32'"]

[tool.setuptools]
py-modules = ["train", "model", "eval", "prepare_data"]
